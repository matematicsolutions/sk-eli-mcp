# Runtime of the Claude plugin: pins sk-eli-mcp and every transitive dependency
# (with hashes) in uv.lock, so the plugin runs exactly what was reviewed.
# Started by plugin.json as: uv run --frozen --project ${CLAUDE_PLUGIN_ROOT}/server sk-eli-mcp
[project]
name = "sk-eli-mcp-plugin-runtime"
version = "0.3.3"
requires-python = ">=3.11,<3.14"
dependencies = ["sk-eli-mcp==0.3.3"]

[tool.uv]
package = false
